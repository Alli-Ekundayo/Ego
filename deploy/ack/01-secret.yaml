# ── Secret: DashScope API Key ─────────────────────────────────────────────────
# Create this secret before applying manifests:
#
#   kubectl create secret generic ego-secrets \
#     --namespace=ego \
#     --from-literal=DASHSCOPE_API_KEY="sk-..." \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The placeholder below is intentionally empty — do NOT commit real keys.
apiVersion: v1
kind: Secret
metadata:
  name: ego-secrets
  namespace: ego
type: Opaque
stringData:
  DASHSCOPE_API_KEY: ""   # <-- fill in via kubectl or CI/CD
  QWEN_MODEL: "qwen-plus"

services:

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    image: ego-frontend:latest
    container_name: ego-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./data:/usr/share/nginx/html/data:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - ego-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ego-api:latest
    container_name: ego-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-flash-latest}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - HF_HOME=/app/scratch/cache/huggingface
      # ── Alibaba Cloud / Qwen (DashScope) ──────────────────────────────────
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-plus}
    volumes:
      - .:/app
      - llm_cache:/app/scratch/cache
      - ./data:/app/data:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 150s
    networks:
      - ego-network


  indexer:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ego-api:latest
    container_name: ego-indexer
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-flash-latest}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - DATASET_BASE_URL=${DATASET_BASE_URL}
      - HF_HOME=/app/scratch/cache/huggingface
    volumes:
      - .:/app
      - ./data:/app/data
    command: [ "python", "scripts/ingest.py", "--index" ]
    profiles:
      - tools
    networks:
      - ego-network

volumes:
  llm_cache:

networks:
  ego-network:
    driver: bridge
